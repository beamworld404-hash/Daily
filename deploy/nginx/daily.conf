# 关注清单日报网站：nginx 静态站配置（仅 HTTP，IP 访问，无域名）
# 系统启用路径：/etc/nginx/sites-available/daily -> sites-enabled/daily
# 由 deploy/install.sh 安装；站点根目录是 Vite 构建产物 web/app/dist。

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /home/ubuntu/Daily/web/app/dist;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 注意：location 内一旦写 add_header，就不再继承 server 级的 add_header，
    # 所以每个 location 都显式写全安全头。

    # Vite 产出的带哈希资源：内容变则文件名变，可长期缓存
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    # 入口文档不缓存，保证新构建立即生效
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # hash 路由 SPA：其余路径找不到文件时回退到 index.html
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ /index.html;
    }

    # 不暴露隐藏文件
    location ~ /\. {
        deny all;
    }
}
